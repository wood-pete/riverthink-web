<svg width="760" height="420" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Security exposure increases as AI agents move from prompt to execution">
  <defs>
    <linearGradient id="riskGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ecae6"></stop>
      <stop offset="45%" stop-color="#219ebc"></stop>
      <stop offset="75%" stop-color="#ffb703"></stop>
      <stop offset="100%" stop-color="#fb8500"></stop>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"></feDropShadow>
    </filter>
  </defs>

  <rect width="760" height="420" rx="24" fill="#f8fafc"></rect>

  <text x="38" y="48" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    Expanding Security Exposure in Agentic AI Systems
  </text>
  <text x="38" y="78" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">
    Risk compounds as an agent moves from instruction to context, tools and execution.
  </text>

  <line x1="90" y1="325" x2="690" y2="325" stroke="#cbd5e1" stroke-width="2"></line>
  <line x1="90" y1="115" x2="90" y2="325" stroke="#cbd5e1" stroke-width="2"></line>

  <text x="34" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">
    Risk
  </text>
  <text x="610" y="358" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">
    Agent lifecycle
  </text>

  <path d="M120 300 C210 280, 250 260, 315 230 C390 195, 455 155, 640 125" fill="none" stroke="url(#riskGradient)" stroke-width="10" stroke-linecap="round"></path>

  <polygon points="640,125 618,120 628,143" fill="#fb8500"></polygon>

  <g filter="url(#shadow)">
    <circle cx="130" cy="295" r="36" fill="#ffffff"></circle>
    <circle cx="260" cy="255" r="36" fill="#ffffff"></circle>
    <circle cx="390" cy="205" r="36" fill="#ffffff"></circle>
    <circle cx="520" cy="155" r="36" fill="#ffffff"></circle>
    <circle cx="650" cy="125" r="36" fill="#ffffff"></circle>
  </g>

  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="130" y="289" font-size="22" font-weight="700" fill="#0284c7">1</text>
    <text x="130" y="311" font-size="12" fill="#334155">Prompt</text>

    <text x="260" y="249" font-size="22" font-weight="700" fill="#0ea5e9">2</text>
    <text x="260" y="271" font-size="12" fill="#334155">Context</text>

    <text x="390" y="199" font-size="22" font-weight="700" fill="#0369a1">3</text>
    <text x="390" y="221" font-size="12" fill="#334155">Reasoning</text>

    <text x="520" y="149" font-size="22" font-weight="700" fill="#d97706">4</text>
    <text x="520" y="171" font-size="12" fill="#334155">Tool Access</text>

    <text x="650" y="119" font-size="22" font-weight="700" fill="#ea580c">5</text>
    <text x="650" y="141" font-size="12" fill="#334155">Execution</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="12" fill="#475569">
    <rect x="105" y="345" width="95" height="34" rx="10" fill="#e0f2fe"></rect>
    <text x="152" y="366" text-anchor="middle">Injection risk</text>

    <rect x="225" y="345" width="110" height="34" rx="10" fill="#e0f2fe"></rect>
    <text x="280" y="366" text-anchor="middle">Memory poisoning</text>

    <rect x="355" y="345" width="95" height="34" rx="10" fill="#fef3c7"></rect>
    <text x="402" y="366" text-anchor="middle">Bad planning</text>

    <rect x="472" y="345" width="105" height="34" rx="10" fill="#ffedd5"></rect>
    <text x="524" y="366" text-anchor="middle">API misuse</text>

    <rect x="600" y="345" width="105" height="34" rx="10" fill="#fed7aa"></rect>
    <text x="652" y="366" text-anchor="middle">Real impact</text>
  </g>

  <text x="420" y="105" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a">
    Exposure grows as authority increases
  </text>
</svg>